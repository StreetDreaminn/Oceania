    Deepest Dive in the Ocean - January 23, 1960
</h1>
<em>Location:  Western Pacific Ocean</em>

<div>
    Jacques Piccard and Don Walsh descended to the bottom of the Mariana Trench aboard the Trieste bathyscaphe.
    They reached a depth of about 10,916 meters (35,814 feet), a record that stood for decades.
